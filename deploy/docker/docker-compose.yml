services:
  docs:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: snn-academy-docs
    restart: unless-stopped
    networks:
      - internal
    # 故意不寫 ports，不對外（不對 host）開任何 port。
    # cloudflared 透過同一個 Docker 網路，用 service 名稱 "docs" 連進來就好。

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: snn-academy-tunnel
    restart: unless-stopped
    # 用跟主機使用者相同的 UID/GID 跑，這樣才讀得到權限嚴格（只有 owner 能讀）的憑證檔，
    # 不需要為了讓 container 讀到而放寬檔案權限。UID/GID 從同目錄的 .env 讀入（見部署文件）。
    user: "${UID}:${GID}"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - docs
    networks:
      - internal

networks:
  internal:
    driver: bridge
