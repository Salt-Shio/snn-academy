server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # VitePress 預設沒開 cleanUrls，頁面都是 .html 結尾，站內連結也都已經帶 .html，
    # 這裡不需要額外的 rewrite 規則。
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # 不要對外暴露 nginx 版本號
    server_tokens off;
}
